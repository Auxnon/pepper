<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pepper - 3D Card Game</title>
  </head>
  <body class="m-0 p-0 overflow-hidden bg-gradient-to-br from-green-900 to-green-700">
    <div id="app" class="relative w-screen h-screen">
      <canvas id="game-canvas" class="absolute inset-0"></canvas>
      <div class="absolute top-4 left-4 text-white">
        <h1 class="text-2xl font-bold mb-4">Pepper Card Game</h1>
        <div class="space-y-2">
          <button id="shuffle-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
            Shuffle Deck
          </button>
          <button id="deal-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition block">
            Deal 5 Cards
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
